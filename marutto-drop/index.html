<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まるっとドロップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen arcade cabinet — the well on the left, a narrow score column on the right, a thumb pad underneath. */
:root {
  --night: #1b1530;      /* cabinet body */
  --well: #0f0b1f;       /* playfield glass */
  --line: #2e2650;       /* grid + panel borders */
  --ink: #f3eefe;        /* primary text */
  --muted: #a69cc8;      /* labels */
  --candy: #ffd23f;      /* the one accent: chain popups, start button */
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 0%, #2a2050 0%, var(--night) 60%) fixed, var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 500;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 12px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 100%;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(1.5rem, 6vw, 2rem);
  letter-spacing: 0.02em;
  line-height: 1.1;
  text-wrap: balance;
}
h1 span:nth-child(1) { color: #ff5a6e; }
h1 span:nth-child(2) { color: #3ddc84; }
h1 span:nth-child(3) { color: #4fa3ff; }
h1 span:nth-child(4) { color: var(--candy); }
.tagline { margin: 0; color: var(--muted); font-size: 0.8rem; }

.stage { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.well {
  position: relative;
  border: 3px solid var(--line);
  border-radius: 14px;
  background: var(--well);
  overflow: hidden;
  line-height: 0;
  box-shadow: inset 0 0 0 1px #000, 0 10px 30px rgb(0 0 0 / 0.35);
}
#field {
  display: block;
  width: min(62vw, calc((100dvh - 250px) / 2), 300px);
  aspect-ratio: 1 / 2;
  height: auto;
  max-width: 100%;
}
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 16px;
  text-align: center;
  line-height: 1.5;
  background: rgb(15 11 31 / 0.82);
  backdrop-filter: blur(2px);
}
.cast { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.cast figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; color: var(--ink); line-height: 1.2; }
.cast canvas { width: 44px; height: 44px; }
.overlay h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; }
.overlay p { margin: 0; color: var(--muted); font-size: 0.82rem; }
.overlay .big { color: var(--ink); font-size: 1rem; font-variant-numeric: tabular-nums; }
.start {
  font: inherit;
  font-family: var(--display);
  font-size: 1.05rem;
  color: #2a1d00;
  background: var(--candy);
  border: 0;
  border-radius: 999px;
  padding: 10px 26px;
  cursor: pointer;
  box-shadow: 0 4px 0 #b8901a;
}
.start:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8901a; }
.popup {
  position: absolute;
  left: 0; right: 0; top: 34%;
  text-align: center;
  font-family: var(--display);
  font-size: clamp(1.6rem, 8vw, 2.4rem);
  line-height: 1.1;
  color: var(--candy);
  text-shadow: 0 3px 0 #7a3cff, 0 0 18px rgb(255 210 63 / 0.6);
  pointer-events: none;
  opacity: 0;
}
.popup.show { animation: pop 0.9s ease-out; }
@keyframes pop {
  0% { opacity: 0; transform: scale(0.6); }
  20% { opacity: 1; transform: scale(1.15); }
  70% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: translateY(-20px); }
}

.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel {
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 8px 10px;
  background: rgb(15 11 31 / 0.6);
}
.label { font-size: 0.68rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
.value { font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; line-height: 1.3; overflow-wrap: anywhere; }
#next { display: block; width: 100%; max-width: 110px; aspect-ratio: 11 / 10; height: auto; margin-top: 4px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool {
  font: inherit;
  font-size: 0.78rem;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 4px 12px;
  cursor: pointer;
}
.tool:hover { border-color: var(--muted); }
.keys { font-size: 0.72rem; color: var(--muted); line-height: 1.7; margin: 0; }
.keys kbd {
  font-family: var(--body);
  font-size: 0.68rem;
  color: var(--ink);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 4px;
}

.pad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.pad button {
  font: inherit;
  font-family: var(--display);
  font-size: 1.15rem;
  color: var(--ink);
  background: #2a2148;
  border: 0;
  border-radius: 14px;
  padding: 12px 0;
  box-shadow: 0 4px 0 #120d24;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
}
.pad button:active, .pad button.held { transform: translateY(3px); box-shadow: 0 1px 0 #120d24; background: #382c60; }
.pad .rot { background: #3b2a6b; }
.pad small { display: block; font-family: var(--body); font-size: 0.6rem; color: var(--muted); line-height: 1.2; }
button:focus-visible { outline: 3px solid var(--candy); outline-offset: 2px; }

@media (pointer: coarse) { .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { .popup.show { animation-duration: 1.4s; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1><span>ま</span><span>るっ</span><span>と</span><span>ドロップ</span></h1>
    <p class="tagline">同じ色を4つつなげて消す、落ちものパズル</p>
  </header>

  <div class="stage">
    <div class="well">
      <canvas id="field" width="288" height="576" aria-label="プレイフィールド"></canvas>
      <div class="popup" id="popup"></div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">あそびかた</h2>
        <p id="ovText">2つ1組で落ちてくる玉を回して積み、同じ色を4つ以上つなげると消えます。消えたあとに落ちた玉がまたそろうと<b style="color:var(--candy)">連鎖</b>で高得点。</p>
        <div class="cast" id="cast"></div>
        <button class="start" id="startBtn" type="button">スタート</button>
      </div>
    </div>

    <aside class="side">
      <div class="panel">
        <div class="label">Next</div>
        <canvas id="next" width="110" height="100" aria-label="次の玉"></canvas>
      </div>
      <div class="panel">
        <div class="label">スコア</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="panel">
        <div class="label">最大連鎖</div>
        <div class="value" id="maxChain">0</div>
      </div>
      <div class="panel">
        <div class="label">ハイスコア</div>
        <div class="value" id="best">0</div>
      </div>
      <div class="tools">
        <button class="tool" id="pauseBtn" type="button">一時停止</button>
        <button class="tool" id="soundBtn" type="button">音 ON</button>
      </div>
      <p class="keys">
        <kbd>←</kbd><kbd>→</kbd> 移動<br>
        <kbd>↓</kbd> 早く落とす<br>
        <kbd>X</kbd><kbd>↑</kbd> 右回転<br>
        <kbd>Z</kbd> 左回転<br>
        <kbd>Space</kbd> 落とす<br>
        <kbd>P</kbd> 一時停止
      </p>
    </aside>
  </div>

  <div class="pad" aria-label="操作ボタン">
    <button type="button" data-act="left" aria-label="左へ">◀<small>左</small></button>
    <button type="button" data-act="right" aria-label="右へ">▶<small>右</small></button>
    <button type="button" data-act="down" aria-label="早く落とす">▼<small>下</small></button>
    <button type="button" data-act="drop" aria-label="一気に落とす">⤓<small>落とす</small></button>
    <button type="button" class="rot" data-act="ccw" aria-label="左回転">↺<small>左回転</small></button>
    <button type="button" class="rot" data-act="cw" aria-label="右回転">↻<small>右回転</small></button>
  </div>
</main>

<script>
(() => {
  'use strict';

  // ---- Board constants -------------------------------------------------
  const COLS = 6;
  const ROWS = 13;          // row 0 is the hidden row above the visible 12
  const SPAWN_X = 2;        // third column — topping out here ends the game
  const S = 48;             // cell size in canvas pixels
  const NUM_COLORS = 4;
  const COLORS = [
    null,
    { base: '#ff8a3d', dark: '#c2541a', light: '#ffd3b0', name: 'にこにこ' }, // big laugh, spiky hair
    { base: '#3f7dff', dark: '#1f45b0', light: '#c4d6ff', name: 'ガッツ' },   // straight bangs, fists up
    { base: '#ffd23f', dark: '#b8901a', light: '#fff0b8', name: 'くるくる' }, // curly hair with a top bun
    { base: '#eef0f6', dark: '#a3a8bf', light: '#ffffff', name: 'ボール' },   // baseball
  ];
  // Child offset for each rotation: 0 = above, 1 = right, 2 = below, 3 = left.
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];

  // Scoring follows the classic arcade formula:
  // 10 × cleared × (chain power + color bonus + group bonus), minimum multiplier 1.
  const CHAIN_POWER = [0, 8, 16, 32, 64, 96, 128, 160, 192, 224, 256, 288, 320, 352, 384, 416, 448, 480, 512];
  const COLOR_BONUS = [0, 0, 3, 6, 12];
  const groupBonus = n => (n >= 11 ? 10 : [0, 0, 0, 0, 0, 2, 3, 4, 5, 6, 7][n]);

  // ---- DOM -------------------------------------------------------------
  const field = document.getElementById('field');
  const ctx = field.getContext('2d');
  const nextCv = document.getElementById('next');
  const nctx = nextCv.getContext('2d');
  const $ = id => document.getElementById(id);
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText'), startBtn = $('startBtn');
  const popup = $('popup');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };

  // ---- State -----------------------------------------------------------
  let grid, offs, cur, queue, state, score, best, chain, maxChain, pieces;
  let fallClock = 0, lockClock = 0, lockResets = 0, softDrop = false;
  let popCells = null, popClock = 0, chainScoreThisLock = 0;
  best = Number(store.get('marutto-best')) || 0;

  const emptyGrid = () => Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  const randColor = () => 1 + Math.floor(Math.random() * NUM_COLORS);
  const newPair = () => ({ a: randColor(), b: randColor() });

  function reset() {
    grid = emptyGrid();
    offs = emptyGrid();
    queue = [newPair(), newPair()];
    score = 0; chain = 0; maxChain = 0; pieces = 0;
    cur = null;
    updateHud();
  }

  const level = () => Math.min(12, Math.floor(pieces / 12));
  const fallInterval = () => Math.max(0.12, 0.85 - level() * 0.06);

  // ---- Piece helpers ---------------------------------------------------
  const childPos = p => [p.x + DIRS[p.rot][0], p.y + DIRS[p.rot][1]];
  function free(x, y) {
    return x >= 0 && x < COLS && y >= 0 && y < ROWS && grid[y][x] === 0;
  }
  function fits(p) {
    const [cx, cy] = childPos(p);
    return free(p.x, p.y) && free(cx, cy);
  }

  function spawn() {
    if (grid[1][SPAWN_X] !== 0) return gameOver();
    const pair = queue.shift();
    queue.push(newPair());
    cur = { x: SPAWN_X, y: 1, rot: 0, a: pair.a, b: pair.b };
    fallClock = 0; lockClock = 0; lockResets = 0;
    state = 'play';
    drawNext();
  }

  function tryMove(dx, dy) {
    const p = { ...cur, x: cur.x + dx, y: cur.y + dy };
    if (!fits(p)) return false;
    cur = p;
    return true;
  }

  function touchLock() {
    if (lockResets < 12) { lockClock = 0; lockResets++; }
  }

  function rotate(dir) {
    if (state !== 'play') return;
    const rot = (cur.rot + dir + 4) % 4;
    const base = { ...cur, rot };
    const [dx, dy] = DIRS[rot];
    // Plain rotation, then a kick away from whatever blocks the child.
    const tries = [base, { ...base, x: base.x - dx, y: base.y - dy }];
    for (const p of tries) {
      if (fits(p)) { cur = p; touchLock(); sfx('turn'); return; }
    }
    // Squeezed between two walls: flip the pair upside down (quick turn).
    if (cur.rot === 0 || cur.rot === 2) {
      const flip = { ...cur, rot: (cur.rot + 2) % 4 };
      const lift = { ...flip, y: flip.y - DIRS[flip.rot][1] };
      for (const p of [flip, lift]) {
        if (fits(p)) { cur = p; touchLock(); sfx('turn'); return; }
      }
    }
  }

  function move(dx) {
    if (state !== 'play') return;
    if (tryMove(dx, 0)) { touchLock(); sfx('move'); }
  }

  function hardDrop() {
    if (state !== 'play') return;
    let rows = 0;
    while (tryMove(0, 1)) rows++;
    score += rows * 2;
    lock();
  }

  function lock() {
    const [cx, cy] = childPos(cur);
    grid[cur.y][cur.x] = cur.a;
    grid[cy][cx] = cur.b;
    cur = null;
    pieces++;
    chain = 0;
    chainScoreThisLock = 0;
    sfx('land');
    gravity();
    state = 'settle';
  }

  // Drops every floating cell straight down and records how far it fell
  // so the renderer can animate the fall.
  function gravity() {
    for (let c = 0; c < COLS; c++) {
      let write = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (!grid[r][c]) continue;
        if (r !== write) {
          grid[write][c] = grid[r][c];
          grid[r][c] = 0;
          offs[write][c] = offs[r][c] + (write - r);
          offs[r][c] = 0;
        }
        write--;
      }
    }
  }

  // Groups of 4+ same-colored cells, ignoring the hidden row.
  function findGroups() {
    const seen = emptyGrid();
    const groups = [];
    for (let r = 1; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const col = grid[r][c];
        if (!col || seen[r][c]) continue;
        const cells = [];
        const stack = [[r, c]];
        seen[r][c] = 1;
        while (stack.length) {
          const [y, x] = stack.pop();
          cells.push([y, x]);
          for (const [dx, dy] of DIRS) {
            const ny = y + dy, nx = x + dx;
            if (ny >= 1 && ny < ROWS && nx >= 0 && nx < COLS && !seen[ny][nx] && grid[ny][nx] === col) {
              seen[ny][nx] = 1;
              stack.push([ny, nx]);
            }
          }
        }
        if (cells.length >= 4) groups.push({ color: col, cells });
      }
    }
    return groups;
  }

  function resolveStep() {
    const groups = findGroups();
    if (!groups.length) {
      if (chain >= 2) maxChain = Math.max(maxChain, chain);
      updateHud();
      spawn();
      return;
    }
    chain++;
    const cleared = groups.reduce((n, g) => n + g.cells.length, 0);
    const colors = new Set(groups.map(g => g.color)).size;
    const bonus = CHAIN_POWER[Math.min(chain - 1, CHAIN_POWER.length - 1)]
      + COLOR_BONUS[colors]
      + groups.reduce((n, g) => n + groupBonus(g.cells.length), 0);
    const gained = 10 * cleared * Math.max(1, bonus);
    score += gained;
    chainScoreThisLock += gained;
    popCells = groups.flatMap(g => g.cells);
    popClock = 0.42;
    state = 'pop';
    if (chain >= 2) showPopup(`${chain}連鎖!`);
    sfx('pop', chain);
    updateHud();
  }

  function gameOver() {
    state = 'over';
    cur = null;
    const isBest = score > best;
    if (isBest) { best = score; store.set('marutto-best', String(best)); }
    updateHud();
    cast.hidden = true;
    ovTitle.textContent = 'ゲームオーバー';
    ovText.innerHTML = `<span class="big">スコア ${score.toLocaleString()}</span><br>最大 ${maxChain} 連鎖${isBest ? '<br><b style="color:var(--candy)">ハイスコア更新!</b>' : ''}`;
    startBtn.textContent = 'もう一度';
    overlay.hidden = false;
    sfx('over');
  }

  function start() {
    initAudio();
    reset();
    overlay.hidden = true;
    startBtn.blur();
    spawn();
  }

  function togglePause() {
    if (state === 'play' || state === 'settle' || state === 'pop') {
      pausedFrom = state;
      state = 'paused';
      cast.hidden = true;
      ovTitle.textContent = '一時停止中';
      ovText.textContent = 'P キーかボタンで再開します。';
      startBtn.textContent = '再開';
      overlay.hidden = false;
    } else if (state === 'paused') {
      state = pausedFrom;
      startBtn.blur();
      overlay.hidden = true;
    }
  }
  let pausedFrom = 'play';

  // ---- Loop ------------------------------------------------------------
  function update(dt) {
    if (state === 'play') {
      fallClock += dt;
      const interval = softDrop ? 0.035 : fallInterval();
      while (fallClock >= interval && state === 'play') {
        fallClock -= interval;
        if (tryMove(0, 1)) {
          if (softDrop) score += 1;
          lockClock = 0;
        } else {
          break;
        }
      }
      if (state === 'play' && !fits({ ...cur, y: cur.y + 1 })) {
        lockClock += dt;
        if (lockClock >= (softDrop ? 0.08 : 0.5)) lock();
      }
    } else if (state === 'settle') {
      let moving = false;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (offs[r][c] > 0) {
          offs[r][c] = Math.max(0, offs[r][c] - dt * 16);
          if (offs[r][c] > 0) moving = true;
        }
      }
      if (!moving) resolveStep();
    } else if (state === 'pop') {
      popClock -= dt;
      if (popClock <= 0) {
        for (const [r, c] of popCells) grid[r][c] = 0;
        popCells = null;
        gravity();
        state = 'settle';
      }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now);
    scoreEl.textContent = score.toLocaleString();
    requestAnimationFrame(frame);
  }

  // ---- Rendering -------------------------------------------------------
  const HAIR = '#1f1716';
  const INK = '#1b1530';
  const SKIN = { light: '#fde4cb', base: '#f3c79e', shade: '#d99f74' };
  const SKIN_BABY = { light: '#fff0e0', base: '#f7d4b2', shade: '#e0ab83' };

  function ballPath(g, cx, cy, r) {
    g.beginPath();
    // Slightly squashed circle reads as soft and jelly-like.
    g.ellipse(cx, cy + r * 0.04, r, r * 0.94, 0, 0, Math.PI * 2);
  }

  function cheeks(g, cx, y, ex, rx, alpha = 0.45) {
    g.fillStyle = `rgba(255, 110, 120, ${alpha})`;
    for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * ex, y, rx, rx * 0.6, 0, 0, Math.PI * 2); g.fill(); }
  }

  // Skin-toned face with ears, set inside the colored ball so the color still reads for matching.
  function drawHead(g, cx, cy, r, skin) {
    const fy = cy + r * 0.1, fr = r * 0.66;
    g.fillStyle = skin.shade;
    for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * fr * 0.98, fy + fr * 0.08, fr * 0.2, fr * 0.24, 0, 0, Math.PI * 2); g.fill(); }
    const grad = g.createRadialGradient(cx - fr * 0.3, fy - fr * 0.4, fr * 0.1, cx, fy, fr * 1.05);
    grad.addColorStop(0, skin.light);
    grad.addColorStop(0.55, skin.base);
    grad.addColorStop(1, skin.shade);
    g.fillStyle = grad;
    g.beginPath(); g.ellipse(cx, fy, fr, fr * 0.97, 0, 0, Math.PI * 2); g.fill();
    return { fy, fr };
  }

  function hairShine(g, cx, cy, rad, from, to) {
    g.strokeStyle = 'rgba(255,255,255,0.18)';
    g.lineWidth = rad * 0.1;
    g.lineCap = 'round';
    g.beginPath(); g.arc(cx, cy, rad, from, to); g.stroke();
  }

  function drawFace(g, cx, cy, r, color, blink) {
    g.save();
    ballPath(g, cx, cy, r);
    g.clip();

    if (color === 4) {
      // Baseball stitches
      g.strokeStyle = '#d8313f';
      g.lineCap = 'round';
      for (const s of [-1, 1]) {
        const ox = cx + s * r * 1.45, R = r * 0.98;
        g.lineWidth = r * 0.07;
        g.beginPath(); g.arc(ox, cy, R, s < 0 ? -0.75 : Math.PI - 0.75, s < 0 ? 0.75 : Math.PI + 0.75); g.stroke();
        g.lineWidth = r * 0.06;
        for (let t = -0.6; t <= 0.61; t += 0.2) {
          const ang = (s < 0 ? 0 : Math.PI) + t;
          const px = ox + Math.cos(ang) * R, py = cy + Math.sin(ang) * R;
          const tx = -Math.sin(ang), ty = Math.cos(ang);
          const k = r * 0.1;
          g.beginPath();
          g.moveTo(px - Math.cos(ang) * k + tx * k * 0.5, py - Math.sin(ang) * k + ty * k * 0.5);
          g.lineTo(px + Math.cos(ang) * k - tx * k * 0.5, py + Math.sin(ang) * k - ty * k * 0.5);
          g.stroke();
        }
      }
      g.restore();
      return;
    }

    if (color === 1) {
      // にこにこ: neat short black hair, ragged fringe, laughing with eyes shut and teeth showing
      const { fy, fr } = drawHead(g, cx, cy, r, SKIN);
      g.fillStyle = HAIR;
      g.beginPath();
      g.moveTo(cx - fr * 1.03, fy + fr * 0.05);
      g.bezierCurveTo(cx - fr * 1.2, fy - fr * 1.35, cx + fr * 1.2, fy - fr * 1.35, cx + fr * 1.03, fy + fr * 0.05);
      g.lineTo(cx + fr * 0.88, fy - fr * 0.22);
      for (const [x, y] of [[0.6, -0.4], [0.38, -0.24], [0.1, -0.44], [-0.15, -0.27], [-0.45, -0.42], [-0.7, -0.26], [-0.9, -0.3]]) {
        g.lineTo(cx + fr * x, fy + fr * y);
      }
      g.closePath();
      g.fill();
      hairShine(g, cx, fy - fr * 0.1, fr * 0.85, Math.PI * 1.2, Math.PI * 1.45);
      // Brows lifted from laughing
      g.strokeStyle = HAIR; g.lineWidth = fr * 0.09; g.lineCap = 'round';
      for (const s of [-1, 1]) { g.beginPath(); g.arc(cx + s * fr * 0.38, fy - fr * 0.06, fr * 0.16, Math.PI * 1.2, Math.PI * 1.8); g.stroke(); }
      // Eyes squeezed into happy arcs
      g.strokeStyle = INK; g.lineWidth = fr * 0.1;
      for (const s of [-1, 1]) { g.beginPath(); g.arc(cx + s * fr * 0.37, fy + fr * 0.14, fr * 0.15, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); }
      cheeks(g, cx, fy + fr * 0.32, fr * 0.6, fr * 0.16, 0.35);
      // Wide open grin, upper teeth showing
      g.save();
      g.beginPath();
      g.moveTo(cx - fr * 0.42, fy + fr * 0.32);
      g.quadraticCurveTo(cx, fy + fr * 1.1, cx + fr * 0.42, fy + fr * 0.32);
      g.closePath();
      g.fillStyle = '#6e1d28';
      g.fill();
      g.clip();
      g.fillStyle = '#ffffff';
      g.fillRect(cx - fr * 0.45, fy + fr * 0.28, fr * 0.9, fr * 0.16);
      g.fillStyle = '#f07583';
      g.beginPath(); g.ellipse(cx, fy + fr * 0.78, fr * 0.2, fr * 0.12, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    } else if (color === 2) {
      // ガッツ: thick black hair with heavy bangs, eyes wide and glancing sideways, mischievous pout
      const { fy, fr } = drawHead(g, cx, cy, r, SKIN);
      g.fillStyle = HAIR;
      g.beginPath();
      g.moveTo(cx - fr * 1.1, fy + fr * 0.2);
      g.bezierCurveTo(cx - fr * 1.3, fy - fr * 1.45, cx + fr * 1.3, fy - fr * 1.45, cx + fr * 1.1, fy + fr * 0.2);
      g.lineTo(cx + fr * 0.95, fy + fr * 0.1);
      const n = 6;
      for (let i = 0; i <= n; i++) {
        g.lineTo(cx + fr * 0.85 - (i * 1.7 * fr) / n, fy - fr * (i % 2 ? 0.14 : 0.24));
      }
      g.lineTo(cx - fr * 0.95, fy + fr * 0.1);
      g.closePath();
      g.fill();
      hairShine(g, cx, fy - fr * 0.15, fr * 0.9, Math.PI * 1.2, Math.PI * 1.45);
      const ey = fy + fr * 0.14, ex = fr * 0.36;
      if (blink) {
        g.strokeStyle = INK; g.lineWidth = fr * 0.1; g.lineCap = 'round';
        for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * ex - fr * 0.15, ey); g.lineTo(cx + s * ex + fr * 0.15, ey); g.stroke(); }
      } else {
        g.fillStyle = '#ffffff';
        for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * ex, ey, fr * 0.18, fr * 0.2, 0, 0, Math.PI * 2); g.fill(); }
        g.fillStyle = INK;
        for (const s of [-1, 1]) { g.beginPath(); g.arc(cx + s * ex - fr * 0.07, ey + fr * 0.02, fr * 0.11, 0, Math.PI * 2); g.fill(); }
      }
      cheeks(g, cx, fy + fr * 0.42, fr * 0.6, fr * 0.18, 0.55);
      // Lips pushed into a sideways smirk
      g.strokeStyle = '#9b3a3a'; g.lineWidth = fr * 0.1; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx - fr * 0.26, fy + fr * 0.62); g.quadraticCurveTo(cx - fr * 0.02, fy + fr * 0.72, cx + fr * 0.24, fy + fr * 0.52); g.stroke();
    } else if (color === 3) {
      // くるくる: big curly dark-brown hair with a top bun, round dark eyes, small lips
      const curl = '#3b2620';
      const fy = cy + r * 0.14, fr = r * 0.6;
      g.fillStyle = curl;
      // Curls behind the face, down to the cheeks
      for (let a = 140; a <= 400; a += 20) {
        const t = (a * Math.PI) / 180;
        g.beginPath(); g.arc(cx + Math.cos(t) * fr * 1.05, fy - fr * 0.1 + Math.sin(t) * fr * 1.0, fr * 0.32, 0, Math.PI * 2); g.fill();
      }
      // Top bun
      for (const [dx, dy, rr] of [[0, -1.55, 0.34], [-0.25, -1.45, 0.24], [0.25, -1.47, 0.24], [0.05, -1.8, 0.2]]) {
        g.beginPath(); g.arc(cx + dx * fr, fy + dy * fr, rr * fr, 0, Math.PI * 2); g.fill();
      }
      const skin = SKIN_BABY;
      const grad = g.createRadialGradient(cx - fr * 0.3, fy - fr * 0.3, fr * 0.1, cx, fy, fr * 1.05);
      grad.addColorStop(0, skin.light);
      grad.addColorStop(0.55, skin.base);
      grad.addColorStop(1, skin.shade);
      g.fillStyle = grad;
      g.beginPath(); g.ellipse(cx, fy + fr * 0.05, fr * 0.98, fr * 0.95, 0, 0, Math.PI * 2); g.fill();
      // Curly fringe pulled up off the forehead
      g.fillStyle = curl;
      for (const [dx, dy, rr] of [[-0.55, -0.62, 0.26], [-0.2, -0.82, 0.26], [0.2, -0.8, 0.26], [0.58, -0.6, 0.26], [0, -1.0, 0.26]]) {
        g.beginPath(); g.arc(cx + dx * fr, fy + dy * fr, rr * fr, 0, Math.PI * 2); g.fill();
      }
      g.strokeStyle = 'rgba(255,255,255,0.2)'; g.lineWidth = fr * 0.08; g.lineCap = 'round';
      for (const [dx, dy] of [[-0.55, -0.62], [0.2, -0.8], [-0.9, -0.1]]) {
        g.beginPath(); g.arc(cx + dx * fr, fy + dy * fr, fr * 0.14, Math.PI * 1.1, Math.PI * 1.7); g.stroke();
      }
      const ey = fy + fr * 0.08, ex = fr * 0.36;
      if (blink) {
        g.strokeStyle = INK; g.lineWidth = fr * 0.1; g.lineCap = 'round';
        for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * ex - fr * 0.16, ey); g.lineTo(cx + s * ex + fr * 0.16, ey); g.stroke(); }
      } else {
        g.fillStyle = INK;
        for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * ex, ey, fr * 0.17, fr * 0.2, 0, 0, Math.PI * 2); g.fill(); }
        g.fillStyle = '#ffffff';
        for (const s of [-1, 1]) {
          g.beginPath(); g.arc(cx + s * ex - fr * 0.05, ey - fr * 0.08, fr * 0.07, 0, Math.PI * 2); g.fill();
        }
      }
      cheeks(g, cx, fy + fr * 0.4, fr * 0.6, fr * 0.2, 0.4);
      // Small, serious lips
      g.fillStyle = '#e06a74';
      g.beginPath(); g.ellipse(cx, fy + fr * 0.6, fr * 0.14, fr * 0.08, 0, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }

  function drawBlob(g, x, y, color, opts = {}) {
    const col = COLORS[color];
    const cx = x + S / 2, cy = y + S / 2;
    const r = S * 0.44 * (opts.scale || 1);
    g.save();
    g.globalAlpha = opts.alpha ?? 1;
    const grad = g.createRadialGradient(cx - r * 0.35, cy - r * 0.45, r * 0.1, cx, cy, r);
    grad.addColorStop(0, col.light);
    grad.addColorStop(0.45, col.base);
    grad.addColorStop(1, col.dark);
    g.fillStyle = grad;
    ballPath(g, cx, cy, r);
    g.fill();
    drawFace(g, cx, cy, r, color, opts.blink);
    if (opts.ring) {
      g.strokeStyle = 'rgba(255,255,255,0.85)';
      g.lineWidth = 2.5;
      g.beginPath(); g.arc(cx, cy, r + 2, 0, Math.PI * 2); g.stroke();
    }
    g.restore();
  }

  // Fat bridge between touching same-colored blobs so groups look fused.
  function drawBridge(g, x1, y1, x2, y2, color) {
    g.save();
    g.strokeStyle = COLORS[color].base;
    g.lineWidth = S * 0.5;
    g.lineCap = 'butt';
    g.beginPath();
    g.moveTo(x1 + S / 2, y1 + S / 2);
    g.lineTo(x2 + S / 2, y2 + S / 2);
    g.stroke();
    g.restore();
  }

  function draw(now) {
    ctx.clearRect(0, 0, field.width, field.height);
    // Grid
    ctx.strokeStyle = 'rgba(120,100,200,0.10)';
    ctx.lineWidth = 1;
    for (let c = 1; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(c * S + 0.5, 0); ctx.lineTo(c * S + 0.5, field.height); ctx.stroke(); }
    for (let r = 1; r < ROWS - 1; r++) { ctx.beginPath(); ctx.moveTo(0, r * S + 0.5); ctx.lineTo(field.width, r * S + 0.5); ctx.stroke(); }
    // Danger mark on the spawn cell
    ctx.save();
    ctx.strokeStyle = 'rgba(255,90,110,0.45)';
    ctx.lineWidth = 4;
    const mx = SPAWN_X * S, m = S * 0.28;
    ctx.beginPath();
    ctx.moveTo(mx + m, m); ctx.lineTo(mx + S - m, S - m);
    ctx.moveTo(mx + S - m, m); ctx.lineTo(mx + m, S - m);
    ctx.stroke();
    ctx.restore();

    if (!grid) return;
    const popping = new Set((popCells || []).map(([r, c]) => r * COLS + c));
    const flash = popping.size ? Math.floor(now / 70) % 2 === 0 : false;
    const blink = (now % 3200) < 140;
    const yOf = (r, c) => (r - 1 - offs[r][c]) * S;

    // Bridges first so blobs paint over them
    for (let r = 1; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const col = grid[r][c];
      if (!col || offs[r][c] > 0) continue;
      if (c + 1 < COLS && grid[r][c + 1] === col && offs[r][c + 1] === 0) drawBridge(ctx, c * S, yOf(r, c), (c + 1) * S, yOf(r, c + 1), col);
      if (r + 1 < ROWS && grid[r + 1][c] === col && offs[r + 1][c] === 0) drawBridge(ctx, c * S, yOf(r, c), c * S, yOf(r + 1, c), col);
    }
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const col = grid[r][c];
      if (!col) continue;
      const y = yOf(r, c);
      if (y <= -S) continue;
      const isPop = popping.has(r * COLS + c);
      drawBlob(ctx, c * S, y, col, {
        blink: blink || isPop,
        scale: isPop ? 1 + (0.42 - popClock) * 0.6 : 1,
        alpha: isPop ? (flash ? 0.35 : 1) : 1,
      });
    }

    if (cur && state !== 'over') {
      // Landing guide
      let gy = cur.y;
      while (fits({ ...cur, y: gy + 1 })) gy++;
      const ghost = { ...cur, y: gy };
      const [gx2, gy2] = childPos(ghost);
      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = COLORS[cur.a].base;
      if (gy >= 1) { ctx.beginPath(); ctx.arc(ghost.x * S + S / 2, (gy - 1) * S + S / 2, S * 0.14, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = COLORS[cur.b].base;
      if (gy2 >= 1) { ctx.beginPath(); ctx.arc(gx2 * S + S / 2, (gy2 - 1) * S + S / 2, S * 0.14, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();

      const [cx, cy] = childPos(cur);
      if (cy >= 1) drawBlob(ctx, cx * S, (cy - 1) * S, cur.b, { blink });
      if (cur.y >= 1) drawBlob(ctx, cur.x * S, (cur.y - 1) * S, cur.a, { blink, ring: true });
    }
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCv.width, nextCv.height);
    if (!queue) return;
    const pairs = [[queue[0], 4, 4, 1], [queue[1], 64, 34, 0.7]];
    for (const [p, x, y, s] of pairs) {
      nctx.save();
      nctx.translate(x, y);
      nctx.scale(s * 0.9, s * 0.9);
      drawBlob(nctx, 0, 0, p.b);
      drawBlob(nctx, 0, S, p.a);
      nctx.restore();
    }
  }

  const scoreEl = $('score');
  function updateHud() {
    scoreEl.textContent = score.toLocaleString();
    $('maxChain').textContent = maxChain;
    $('best').textContent = Math.max(best, score).toLocaleString();
  }

  let popupTimer;
  function showPopup(text) {
    popup.textContent = text;
    popup.classList.remove('show');
    void popup.offsetWidth;
    popup.classList.add('show');
    clearTimeout(popupTimer);
    popupTimer = setTimeout(() => popup.classList.remove('show'), 950);
  }

  // ---- Sound -----------------------------------------------------------
  let audio = null, soundOn = store.get('marutto-sound') !== 'off';
  const soundBtn = $('soundBtn');
  soundBtn.textContent = soundOn ? '音 ON' : '音 OFF';
  function initAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  function tone(freq, dur, type = 'sine', vol = 0.12, when = 0) {
    if (!audio || !soundOn) return;
    const t = audio.currentTime + when;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur);
  }
  function sfx(kind, n = 1) {
    switch (kind) {
      case 'move': tone(420, 0.04, 'square', 0.03); break;
      case 'turn': tone(660, 0.05, 'triangle', 0.06); break;
      case 'land': tone(160, 0.08, 'sine', 0.12); break;
      case 'pop': {
        const base = 440 * Math.pow(2, (Math.min(n, 12) - 1) * 2 / 12);
        tone(base, 0.14, 'triangle', 0.14);
        tone(base * 1.5, 0.18, 'sine', 0.08, 0.06);
        break;
      }
      case 'over': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, i * 0.18)); break;
    }
  }

  // ---- Input -----------------------------------------------------------
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(k)) e.preventDefault();
    if (state === 'over' || state === 'title') {
      if ((k === 'Enter' || k === ' ') && !e.repeat) start();
      return;
    }
    if (k === 'p' || k === 'P' || k === 'Escape') { if (!e.repeat) togglePause(); return; }
    if (state === 'paused') return;
    switch (k) {
      case 'ArrowLeft': move(-1); break;
      case 'ArrowRight': move(1); break;
      case 'ArrowDown': softDrop = true; break;
      case 'ArrowUp': case 'x': case 'X': if (!e.repeat) rotate(1); break;
      case 'z': case 'Z': if (!e.repeat) rotate(-1); break;
      case ' ': if (!e.repeat) hardDrop(); break;
    }
  });
  document.addEventListener('keyup', e => { if (e.key === 'ArrowDown') softDrop = false; });

  // Touch / mouse pad with auto-repeat for left/right.
  const actions = {
    left: () => move(-1),
    right: () => move(1),
    cw: () => rotate(1),
    ccw: () => rotate(-1),
    drop: () => hardDrop(),
  };
  document.querySelectorAll('.pad button').forEach(btn => {
    const act = btn.dataset.act;
    let repeatTimer = null, delayTimer = null;
    const stop = () => {
      btn.classList.remove('held');
      clearTimeout(delayTimer); clearInterval(repeatTimer);
      if (act === 'down') softDrop = false;
    };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      initAudio();
      if (state !== 'play' && state !== 'settle' && state !== 'pop') return;
      btn.setPointerCapture?.(e.pointerId);
      btn.classList.add('held');
      if (act === 'down') { softDrop = true; return; }
      actions[act]();
      if (act === 'left' || act === 'right') {
        delayTimer = setTimeout(() => { repeatTimer = setInterval(actions[act], 70); }, 180);
      }
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, stop));
  });

  startBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause(); else start();
  });
  $('pauseBtn').addEventListener('click', () => { if (state !== 'over' && state !== 'title') togglePause(); });
  soundBtn.addEventListener('click', () => {
    initAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '音 ON' : '音 OFF';
    store.set('marutto-sound', soundOn ? 'on' : 'off');
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && (state === 'play' || state === 'settle' || state === 'pop')) togglePause();
  });

  // ---- Attract screen: a sample stack behind the instructions ----------
  reset();
  const demo = [
    '......',
    '......',
    '......',
    '......',
    '......',
    '......',
    '......',
    '......',
    '4....3',
    '42..23',
    '412.13',
    '311224',
    '332144',
  ];
  demo.forEach((row, r) => [...row].forEach((ch, c) => { grid[r][c] = ch === '.' ? 0 : Number(ch); }));
  state = 'title';
  drawNext();
  const cast = $('cast');
  for (let c = 1; c <= NUM_COLORS; c++) {
    const fig = document.createElement('figure');
    const cv = document.createElement('canvas');
    cv.width = 56; cv.height = 56;
    const g = cv.getContext('2d');
    g.translate(4, 6);
    drawBlob(g, 0, 0, c);
    const cap = document.createElement('figcaption');
    cap.textContent = COLORS[c].name;
    fig.append(cv, cap);
    cast.append(fig);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
